# sshd inside the remote container.
#
# DELIBERATELY NO `Port` DIRECTIVE HERE. arch-remote-run generates
# 20-port.conf and bind-mounts it alongside this file, so the port stays a
# runtime flag rather than an image property.
#
# Port must appear exactly ONCE across the whole config. sshd ACCUMULATES Port
# directives rather than letting a later one override an earlier one, so a
# `Port 22` here plus `Port 2222` in the drop-in makes sshd listen on both.
# Under --net=host that means binding 22 on the VM, which collides with the
# VM's own sshd and takes the whole daemon down — not just the extra listener.

# This container is reachable from the internet the moment the port is
# published, so: keys only, no root, and only the desktop user.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
AllowUsers lewis

# Host keys live on a bind mount (see arch-remote-run) rather than in the
# image. Baked-in host keys would ship a private key to anyone who pulls the
# image, and regenerating them per container start makes your laptop refuse to
# connect with a host-key-changed warning on every restart.
HostKey /etc/ssh/keys/ssh_host_ed25519_key
HostKey /etc/ssh/keys/ssh_host_rsa_key

# We never open a logind session (the nested-userns limitation the desktop
# image documents), so nothing else would set this. waypipe and other Wayland
# clients expect a runtime dir to exist; tmpfiles.d creates the directory
# itself. pam_systemd is `-session optional` on Arch, so its failure in here is
# harmless and UsePAM can stay at its default.
SetEnv XDG_RUNTIME_DIR=/run/user/1000

# X11 forwarding is pointless here: waypipe carries Wayland, and there is no
# X server on either side of this connection by default.
X11Forwarding no
